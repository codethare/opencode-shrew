[package]
name = "ocs"
version = "0.1.0"
edition = "2024"
description = "OpenCode session viewer - read opencode sessions directly from SQLite"

[dependencies]
rusqlite = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
chrono = "0.4"
anyhow = "1"
ctrlc = "3.4"
crossterm = "0.28"
syntect = { version = "5", default-features = false, features = ["default-fancy", "parsing", "dump-load"] }
regex = "1"
unicode-width = "0.2"
pulldown-cmark = "0.13.4"
