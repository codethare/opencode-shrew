[package]
name = "ocs"
version = "0.1.0"
edition = "2024"
description = "OpenCode session viewer - read opencode sessions directly from SQLite"

[dependencies]
rusqlite = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
chrono = "0.4"
anyhow = "1"
ctrlc = "3.4"
